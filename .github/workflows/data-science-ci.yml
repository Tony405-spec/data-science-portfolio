# Data Science Portfolio - Complete CI/CD Pipeline
# This workflow automates testing, notebook execution, and report generation

name: Data Science Portfolio CI

# Trigger on pushes to main, pull requests, weekly schedule, and manual dispatch
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # Set environment variables
    env:
      PYTHON_VERSION: '3.10'
      
    steps:
    # Step 1: Check out the repository code
    - name: Checkout code
      uses: actions/checkout@v4
      
    # Step 2: Set up Python environment
    - name: Setup Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        
    # Step 3: Install all dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Install Jupyter kernel for notebook execution
        python -m ipykernel install --user --name=portfolio-env
        
    # Step 4: Run code quality checks
    - name: Lint with flake8
      run: |
        # Check for syntax errors
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Check for style issues (warnings only)
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Check formatting with black
      run: |
        black --check --diff . --line-length=127
        
    # Step 5: Run unit tests
    - name: Run pytest tests
      run: |
        pytest tests/ -v --cov=src --cov-report=term-missing
        
    # Step 6: Execute all Jupyter notebooks
    - name: Execute Jupyter notebooks
      run: |
        mkdir -p reports/executed_notebooks
        for notebook in $(find notebooks -name "*.ipynb"); do
          echo "Executing: $notebook"
          out_name="$(basename "$notebook")"
          jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout=600 \
            --ExecutePreprocessor.kernel_name=portfolio-env \
            --output "$out_name" \
            --output-dir reports/executed_notebooks \
            "$notebook" || exit 1
        done
        
    # Step 7: Run data preprocessing scripts
    - name: Run data preprocessing
      run: |
        python scripts/data_preprocessing.py
        
    # Step 8: Generate visualizations
    - name: Generate visualizations
      run: |
        python scripts/visualization_generator.py
        
    # Step 9: Train ML models
    - name: Train machine learning models
      run: |
        python scripts/model_training.py
        
    # Step 10: Convert notebooks to HTML reports
    - name: Generate HTML reports
      run: |
        mkdir -p reports/html
        # Convert all notebooks to HTML
        for notebook in notebooks/reports/*.ipynb; do
          if [ -f "$notebook" ]; then
            jupyter nbconvert --to html \
              --output-dir=reports/html \
              "$notebook"
          fi
        done
        
    # Step 11: Upload all artifacts
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: portfolio-artifacts
        path: |
          reports/html/
          reports/figures/
          models/*.pkl
          data/processed/*.csv
        retention-days: 30
